<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>웰니스 K-POP 제안서</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위에 슬라이드 한 장(16:9), 아래에 이전·다음 버튼과 쪽 번호, 맨 아래 썸네일 줄 */
:root{
  --bg:#eceef3; --panel:#ffffff; --fg:#14213d; --muted:#5d6678; --line:#d4d9e3;
  --accent:#1e3a8a; --accent-fg:#ffffff; --stage:#0d1530;
  --font:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1320; --panel:#171c2e; --fg:#e8ecf6; --muted:#9aa4bb; --line:#2a3250;
    --accent:#f4cf6b; --accent-fg:#14213d; --stage:#05080f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1320; --panel:#171c2e; --fg:#e8ecf6; --muted:#9aa4bb; --line:#2a3250;
  --accent:#f4cf6b; --accent-fg:#14213d; --stage:#05080f; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);padding-inline:16px;padding-block:18px 28px;margin:0}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
h1{font-size:1.15rem;font-weight:700;margin:0;text-wrap:balance}
header p{margin:0;font-size:.85rem;color:var(--muted)}
.stage{background:var(--stage);border-radius:10px;overflow:hidden;position:relative;aspect-ratio:16/9;width:100%;box-shadow:0 6px 24px rgba(10,16,40,.18)}
.stage img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.nav{display:flex;align-items:center;justify-content:center;gap:14px}
.nav button{min-width:96px;padding:10px 18px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;font:500 .95rem var(--font);cursor:pointer}
.nav button:hover:not(:disabled){border-color:var(--accent)}
.nav button:disabled{opacity:.4;cursor:default}
.nav button:focus-visible,.thumbs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-variant-numeric:tabular-nums;font-size:.95rem;min-width:64px;text-align:center;color:var(--muted)}
.count b{color:var(--fg)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.thumbs button{padding:0;border:2px solid transparent;background:var(--panel);border-radius:6px;overflow:hidden;cursor:pointer;aspect-ratio:16/9;position:relative}
.thumbs button img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs span{position:absolute;left:4px;bottom:3px;font-size:.7rem;background:rgba(0,0,0,.6);color:#fff;border-radius:3px;padding:0 4px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.stage img{transition:opacity .15s}}

/* 폰(화면 폭 760px 이하)에서는 슬라이드를 위아래로 쭉 이어서 보여 주고, 그보다 넓으면 한 장씩 넘겨 본다 */
.scroll{display:none;flex-direction:column;gap:14px}
.scroll figure{margin:0;position:relative;background:var(--stage);border-radius:8px;overflow:hidden;aspect-ratio:16/9}
.scroll img{width:100%;height:100%;object-fit:contain;display:block}
.scroll figcaption{position:absolute;right:6px;bottom:5px;font-size:.7rem;background:rgba(0,0,0,.6);color:#fff;border-radius:3px;padding:0 6px;font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .stage,.nav,.thumbs{display:none}
  .scroll{display:flex}
  header{flex-direction:column}
}
</style>
</head><body>

<div class="wrap">
  <header>
    <h1>예뻐지는 주문, 개구리 뒷다리 · 웰니스 K-POP 사업 제안서</h1>
    <p>제안자 작곡가 김무정 · JYP엔터테인먼트 제출용</p>
  </header>
  <div class="stage" id="stage"><img id="slide" alt="" src="slides/01.jpg"></div>
  <div class="nav">
    <button id="prev" type="button">← 이전</button>
    <span class="count" id="count"></span>
    <button id="next" type="button">다음 →</button>
  </div>
  <div class="thumbs" id="thumbs"></div>
  <div class="scroll" id="scroll"></div>
</div>

<script>
var N=15, cur=1;
var alts=["표지","핵심 가치 요약","제안자와 IP 현황","왜 미소를 잃었는가","언어의 마법","신경학적 강제성","스마일 챌린지 안무","4세대를 통합하는 IP","웰니스 K-POP 시장","JYP 시너지 1 쇼츠 챌린지","JYP 시너지 2 키즈·애니메이션","JYP 시너지 3 ESG","글로벌 확장 로드맵","협업 프레임워크","마무리 제안"];
function src(i){return "slides/"+(i<10?"0":"")+i+".jpg";}
var slide=document.getElementById("slide"), count=document.getElementById("count");
var prev=document.getElementById("prev"), next=document.getElementById("next"), thumbs=document.getElementById("thumbs");
for(var i=1;i<=N;i++){(function(i){
  var b=document.createElement("button"); b.type="button"; b.setAttribute("aria-label",i+"쪽 "+alts[i-1]);
  b.innerHTML='<img loading="lazy" alt="" src="'+src(i)+'"><span>'+i+'</span>';
  b.onclick=function(){go(i);}; thumbs.appendChild(b);
})(i);}
function go(n){
  cur=Math.max(1,Math.min(N,n));
  slide.src=src(cur); slide.alt=cur+"쪽 "+alts[cur-1];
  count.innerHTML="<b>"+cur+"</b> / "+N;
  prev.disabled=cur===1; next.disabled=cur===N;
  var bs=thumbs.children; for(var k=0;k<bs.length;k++){ bs[k].setAttribute("aria-current",(k+1)===cur?"true":"false"); }
  if(cur<N){ new Image().src=src(cur+1); }
  try{ if(history.replaceState){ history.replaceState(null,"","#"+cur); } }catch(e){}
}
prev.onclick=function(){go(cur-1);}; next.onclick=function(){go(cur+1);};
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();go(cur+1);}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(cur-1);}
  else if(e.key==="Home"){go(1);} else if(e.key==="End"){go(N);}
});
var sx=null; var st=document.getElementById("stage");
st.addEventListener("touchstart",function(e){sx=e.changedTouches[0].clientX;},{passive:true});
st.addEventListener("touchend",function(e){ if(sx===null)return; var dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40){go(dx<0?cur+1:cur-1);} sx=null;},{passive:true});
st.addEventListener("click",function(e){ var r=st.getBoundingClientRect(); go((e.clientX-r.left)<r.width/2?cur-1:cur+1); });
var h=parseInt((location.hash||"").slice(1),10); go(h>=1&&h<=N?h:1);

var sc=document.getElementById("scroll");
for(var j=1;j<=N;j++){
  var f=document.createElement("figure"); f.id="p"+j;
  f.innerHTML='<img loading="lazy" decoding="async" alt="'+j+'쪽 '+alts[j-1]+'" src="'+src(j)+'"><figcaption>'+j+' / '+N+'</figcaption>';
  sc.appendChild(f);
}
var hh=parseInt((location.hash||"").slice(1),10);
if(hh>=1&&hh<=N&&window.matchMedia("(max-width:760px)").matches){ setTimeout(function(){ var e=document.getElementById("p"+hh); if(e){e.scrollIntoView();} },50); }
</script>

</body></html>
